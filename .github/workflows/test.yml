name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write  # publish the coverage badge from main

jobs:
  test:
    runs-on: ubuntu-latest
    # Pre-release Pythons are tested to catch problems early, but don't fail CI.
    continue-on-error: ${{ matrix.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        prerelease: [false]
        include:
          - python-version: "3.15"
            prerelease: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.prerelease }}
      - run: pip install -e ".[api,cli,mcp,test]"
      - run: ruff check
      - run: pytest --cov=nytgames --cov-report=term --cov-report=json
      - name: Publish the coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.python-version == '3.12'
        run: |
          python -c "
          import json
          percent = json.load(open('coverage.json'))['totals']['percent_covered']
          color = 'brightgreen' if percent >= 90 else 'green' if percent >= 80 else 'yellow' if percent >= 70 else 'red'
          json.dump({'schemaVersion': 1, 'label': 'coverage', 'message': f'{percent:.0f}%', 'color': color}, open('coverage-badge.json', 'w'))
          "
          scripts/publish_badges.sh coverage-badge.json

  # Each extra installed alone must work without a system time zone database,
  # which Windows and slim containers don't have. The test job installs every
  # extra at once, which can hide a missing dependency.
  extras:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        extra: [cli, mcp]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ".[${{ matrix.extra }}]"
      - name: Import without a system time zone database
        env:
          PYTHONTZPATH: ""
        run: python scripts/check_extra.py ${{ matrix.extra }}

  # The source distribution must be complete: built here, it's extracted away
  # from the checkout, builds its own wheel and runs its own offline tests.
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - run: scripts/check_sdist.sh dist/*.tar.gz

name: Publish to PyPI

# Tags (v*) publish to TestPyPI, then PyPI. Run it by hand from any branch to
# try a release on TestPyPI only: https://test.pypi.org/project/nytimes-games/
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/nytgames/__init__.py').read()).group(1))")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - run: pip install -e ".[api,cli,mcp,test]" build
      - run: pytest
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/nytimes-games/
    permissions:
      # Trusted publishing: no API token is stored in the repo.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A version tried by hand before tagging is already there.
          skip-existing: true

  publish:
    needs: testpypi
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nytimes-games/
    permissions:
      # Trusted publishing: no API token is stored in the repo.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

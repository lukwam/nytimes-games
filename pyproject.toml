[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nytimes-games"
dynamic = ["version"]
description = "Unofficial Python client for the New York Times Games APIs: Wordle, Connections, Strands, Spelling Bee, Letter Boxed and the crosswords"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lukas Karlsson", email = "lukwam@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "nytimes",
    "nyt",
    "games",
    "wordle",
    "connections",
    "strands",
    "spelling-bee",
    "letter-boxed",
    "crossword",
    "puzzles",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "pydantic>=2.8",
    "requests>=2.32",
    "urllib3>=1.26",
]

[project.optional-dependencies]
async = ["httpx>=0.27"]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
mcp = ["mcp>=2.3"]
cli = [
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.12",
    "tzdata; sys_platform == 'win32'",
]
test = ["fastapi>=0.111", "httpx", "ipuz", "puzpy", "pytest", "pytest-cov", "pyyaml>=6", "rich>=13", "typer>=0.12", "xmlschema", "mcp>=2.3"]

[project.scripts]
nytg = "nytgames.cli:main"
nytg-mcp = "nytgames.mcp_cli:main"

[project.urls]
Homepage = "https://github.com/lukwam/nytimes-games"
Issues = "https://github.com/lukwam/nytimes-games/issues"
Releases = "https://github.com/lukwam/nytimes-games/releases"
Changelog = "https://github.com/lukwam/nytimes-games/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nytgames = ["py.typed", "badges.json"]

[tool.setuptools.dynamic]
version = { attr = "nytgames.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nytimes-games"
dynamic = ["version"]
description = "Unofficial Python client for the New York Times Games APIs: Wordle, Connections, Strands, Spelling Bee, Letter Boxed and the crosswords"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lukas Karlsson", email = "lukwam@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "nytimes",
    "nyt",
    "games",
    "wordle",
    "connections",
    "strands",
    "spelling-bee",
    "letter-boxed",
    "crossword",
    "puzzles",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.optional-dependencies]
# Kept so `pip install "nytimes-games[async]"` still works; httpx is now a core dependency.
async = []
api = ["fastapi>=0.111", "uvicorn>=0.30"]
# The MCP server and CLI work in New York time; tzdata supplies it where the
# system has no time zone database (Windows, slim containers).
mcp = ["mcp>=2.3", "tzdata"]
cli = [
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.12",
    "tzdata",
]
test = ["fastapi>=0.111", "ipuz", "puzpy", "pytest", "pyyaml>=6", "pytest-asyncio", "pytest-cov", "respx", "rich>=13", "ruff", "typer>=0.12", "xmlschema", "mcp>=2.3"]

[project.scripts]
nytg = "nytgames.cli:main"
nytg-mcp = "nytgames.mcp_cli:main"

[project.urls]
Homepage = "https://github.com/lukwam/nytimes-games"
Issues = "https://github.com/lukwam/nytimes-games/issues"
Releases = "https://github.com/lukwam/nytimes-games/releases"
Changelog = "https://github.com/lukwam/nytimes-games/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nytgames = ["py.typed", "badges.json"]

[tool.setuptools.dynamic]
version = { attr = "nytgames.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits NYT over the network (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
force-single-line = true
